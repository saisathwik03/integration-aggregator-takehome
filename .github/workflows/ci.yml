name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: make test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install OpenBao
        run: |
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo update

          helm upgrade --install openbao \
            openbao/openbao \
            --namespace openbao \
            --create-namespace \
            --force-conflicts \
            -f deploy/openbao/values.yaml

      - name: Wait for OpenBao
        run: |
          echo "Waiting for OpenBao StatefulSet..."

          for i in {1..60}; do
            if kubectl get statefulset/openbao -n openbao >/dev/null 2>&1; then
              echo "OpenBao StatefulSet exists."
              break
            fi

            echo "Waiting for StatefulSet to be created... ($i/60)"
            sleep 5
          done

          echo "Waiting for OpenBao pod to be created..."

          for i in {1..60}; do
            if kubectl get pod/openbao-0 -n openbao >/dev/null 2>&1; then
              echo "OpenBao pod exists."
              break
            fi

            echo "Waiting for openbao-0 pod... ($i/60)"
            sleep 5
          done

          echo "OpenBao StatefulSets:"
          kubectl get statefulset -n openbao

          echo "OpenBao Pods:"
          kubectl get pods -n openbao -o wide

          echo "Waiting for OpenBao pod to become ready..."

          kubectl wait \
            --namespace openbao \
            --for=condition=ready pod/openbao-0 \
            --timeout=300s

      - name: Debug OpenBao if needed
        if: failure()
        run: |
          echo "=== OpenBao StatefulSets ==="
          kubectl get statefulsets -n openbao -o wide || true

          echo "=== OpenBao Pods ==="
          kubectl get pods -n openbao -o wide || true

          echo "=== OpenBao Pod Description ==="
          kubectl describe pod/openbao-0 -n openbao || true

          echo "=== OpenBao Events ==="
          kubectl get events -n openbao --sort-by=.lastTimestamp || true

      - name: Enable OAuth2 secrets engine
        run: |
          kubectl exec -n openbao openbao-0 -- \
            sh -c 'bao secrets list -format=json | grep -q "\"oauth2/\"" || bao secrets enable -path=oauth2 oauthapp'

      - name: Build application image
        run: docker build -t integration-aggregator:local .

      - name: Load application image
        run: minikube image load integration-aggregator:local

      - name: Deploy application
        run: |
          helm upgrade --install integration-aggregator \
            deploy/integration-aggregator \
            --set-string openbao.token=root

      - name: Wait for application
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/integration-aggregator-integration-aggregator \
            --timeout=180s

      - name: Port forward application
        run: |
          kubectl port-forward \
            --address 127.0.0.1 \
            svc/integration-aggregator-integration-aggregator \
            8000:8000 > /tmp/port-forward.log 2>&1 &

          sleep 5

      - name: Run E2E smoke test
        run: make e2e
      
      - name: Install k6
        run: |
          sudo gpg -k
          curl -s https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/k6-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list

          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run performance test
        run: |
          k6 run scripts/perf.js \
            --summary-export=perf/k6-summary.json

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            perf/k6-summary.json
            perf/report.md

  publish:
    needs:
      - test
      - e2e
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          docker build \
            -t "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${REGISTRY}/${IMAGE_NAME}:latest" \
            .

          docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Log in to GHCR for Helm
        run: |
          echo "${GITHUB_TOKEN}" | \
            helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: |
          helm package deploy/integration-aggregator \
            --version "0.1.${GITHUB_RUN_NUMBER}" \
            --app-version "${GITHUB_SHA}"

      - name: Push Helm chart to GHCR
        run: |
          helm push \
            "integration-aggregator-0.1.${GITHUB_RUN_NUMBER}.tgz" \
            "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/helm"          