apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "integration-aggregator.fullname" . }}
  labels:
    app: {{ include "integration-aggregator.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "integration-aggregator.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "integration-aggregator.name" . }}
    spec:
      serviceAccountName: {{ include "integration-aggregator.serviceAccountName" . }}
      containers:
        - name: integration-aggregator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.address | quote }}
            - name: OPENBAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "integration-aggregator.fullname" . }}-openbao
                  key: token

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}