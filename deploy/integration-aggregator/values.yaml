image:
  repository: integration-aggregator
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

openbao:
  address: http://openbao.openbao.svc.cluster.local:8200
  token: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10